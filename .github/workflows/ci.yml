name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install validator
        run: python -m pip install --requirement .github/requirements-ci.txt
      - name: Parse GitLab CI YAML
        run: python .github/scripts/validate_yaml.py
      - name: Check shell syntax
        run: find integration -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Run ShellCheck
        run: find integration -type f -name '*.sh' -print0 | xargs -0 shellcheck
