---
.php:compose:
  stage: 'build'
  interruptible: true
  image: '${AWS_ECR_REGISTRY}/services/php-fpm:dev-03.02.028'
  # tags: 
  #   - 'node'
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer/cache"
    BUILD_PATH: ''
    GIT_DEPTH: 0
  before_script:
    # - !reference [.set_TAG, before_script]
    - 'if [ "${BUILD_PATH}" != "" ]; then cd ${BUILD_PATH}; fi'
    - 'git config --global --add safe.directory "$CI_PROJECT_DIR"'
  script:
    # --- build ---
    - 'php ./init --env=Docker --overwrite=All'
    - 'php composer.phar install -vvv'
    # --- diff ---
    - |
      echo "Calculating git diff..."
      git fetch --no-tags --prune --depth=100 origin || true
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo "MR pipeline"
        git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        BASE="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        # git diff --name-only --diff-filter=ACMRTUXB $BASE...$CI_COMMIT_SHA | grep -E '\.php$' > changed_files.txt || true 
        git diff --name-only --diff-filter=ACMRTUXB $BASE...$CI_COMMIT_SHA -- '*.php' > changed_files.txt

      elif [ -z "$CI_COMMIT_BEFORE_SHA" ] || [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
        echo "Fallback"
        git diff --name-only --diff-filter=ACMRTUXB HEAD~1 HEAD -- '*.php' > changed_files.txt
      else
        echo "Push pipeline"
        git diff --name-only --diff-filter=ACMRTUXB $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA -- '*.php' > changed_files.txt
      fi

      echo "Changed files:"
      cat changed_files.txt

  cache:
    key:
      files:
        - composer.lock
    paths:
      - vendor/
      - .composer/cache
  artifacts:
    paths:
      - '.'
      - changed_files.txt
    exclude:
      - .git/
      - .git/**/*
      - node_modules/
      - node_modules/**/*
      - .cache/
      - .cache/**/*
    expire_in: '5 minutes'
