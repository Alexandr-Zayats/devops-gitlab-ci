---
.tests:gradle:
  stage: 'test'
  image: '${AWS_ECR_REGISTRY}/services/gradle:dev-02.01.297'
  script:
    - 'gradle test --no-daemon -Dkotlin.compiler.execution.strategy=in-process'
  artifacts:
    when: 'always'
    reports:
      junit: 'build/test-results/test/TEST-*.xml'
    paths:
      - '.gradle/**'
      - 'build/**'
    expire_in: '1 hour'
  rules:
    - if: '$RUN_TESTS == "true"'
