---

.create:env:
  stage: 'feature:env'
  variables:
    message: "create new feature env ${ENV}"
  before_script:
    - !reference [.k8s:init, before_script]
    - 'git clone "$FEATURE_REPO" features'
    - 'cd features'
  script:
    - |
      selected_zone=$(aws ec2 describe-subnets \
        --query 'Subnets[*].{Name:Tags[?Key==`Name`]|[0].Value,AZ:AvailabilityZone,Available:AvailableIpAddressCount}' \
        --output json | jq -r '.[] | select(.Name | test("demo-platform-dev-private")) | "\(.AZ) \(.Available)"' | \
        awk '{count[$1]+=$2} END {max=0; for (az in count) if(count[az]>max){max=count[az]; zone=az} print zone}' | xargs)

      echo "ZONE: $selected_zone ."
      if [ -e ${ENV}-apps.yaml ]; then
        echo "already deployed"
      elif [ -e destroyed/${ENV}-apps.yaml ]; then
        mv destroyed/${ENV}-apps.yaml ./${ENV}-apps.yaml
      else
        aws s3 cp s3://${S3_BUCKET}/dev/ s3://${S3_BUCKET}/${ENV}/ --recursive
        echo "# Generated by GitLab CI" > generated.txt
        date >> generated.txt
        cp ./kan-000-apps.yaml ./${ENV}-apps.yaml
        if [[ "$selected_zone" != "" ]]; then
          sed -i "s/ZONE: us-east-1b/ZONE: ${selected_zone}/g" ./${ENV}-apps.yaml
        fi
        sed -i "s/kan-000/${ENV}/g" ./${ENV}-apps.yaml
        curl -k 'https://junction.service.int/api/v1/environments' \
          -H 'Accept: */*' \
          -H 'Connection: keep-alive' \
          -H 'Content-Type: application/json' \
          --data-raw "{\"name\":\"${ENV}\",\"isEnabled\":true,\"proxyUntil\":null}"
      fi
    - !reference ['.git:commit', after_script]
